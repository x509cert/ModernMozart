name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/ModernMozart.Core.Tests -c Release

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: dotnet workload install maui-android
      - run: dotnet publish src/ModernMozart.App -c Release -f net10.0-android -o publish
      - uses: actions/upload-artifact@v5
        with:
          name: ModernMozart-apk
          path: publish/*-Signed.apk

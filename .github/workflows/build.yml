name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/ModernMozart.Core.Tests -c Release

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: dotnet workload install maui-android

      # Signed with the release key when the KEYSTORE_B64 / KEYSTORE_PASSWORD secrets exist,
      # so each build installs over the last. Without them it falls back to a throwaway debug key.
      - name: Publish APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          SIGN=()
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            SIGN=(-p:AndroidKeyStore=true
                  -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.p12"
                  -p:AndroidSigningKeyAlias=modernmozart
                  -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD
                  -p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD)
            echo "Signing with release key"
          else
            echo "::warning::KEYSTORE_B64 not set — signing with a throwaway debug key"
          fi
          dotnet publish src/ModernMozart.App -c Release -f net10.0-android -o publish "${SIGN[@]}"
          cp publish/*-Signed.apk ModernMozart.apk

      - uses: actions/upload-artifact@v5
        with:
          name: ModernMozart-apk
          path: ModernMozart.apk

  # Boot an emulator, launch the APK, and capture logcat + a screenshot.
  smoke:
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ModernMozart-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r ModernMozart.apk
            adb logcat -c
            adb shell monkey -p com.x509cert.modernmozart -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > screen.png
            adb logcat -d > logcat.txt
            grep -E "FATAL EXCEPTION|E AndroidRuntime|MonoDroid|XamlParseException" logcat.txt | head -120 || true
            adb shell pidof com.x509cert.modernmozart || (echo "::error::App is not running 25 s after launch" && exit 1)
            adb shell uiautomator dump /sdcard/ui.xml && adb pull /sdcard/ui.xml ui.xml
            grep -q "Würfelspiel" ui.xml || (echo "::error::Main page did not render" && exit 1)
            sh -c 'B=$(grep -o "text=\"▶  Play\"[^>]*bounds=\"\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]" ui.xml | grep -o "\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]" | tr "[],"  "   "); set -- $B; echo "Play button bounds: $B"; adb shell input tap $(( ($1+$3)/2 )) $(( ($2+$4)/2 ))'
            sleep 10
            adb logcat -d | grep -E "FATAL EXCEPTION|E AndroidRuntime|MediaPlayer.*error" | head -60 || true
            adb shell pidof com.x509cert.modernmozart || (echo "::error::App died after pressing Play" && exit 1)
            adb shell uiautomator dump /sdcard/ui2.xml && adb pull /sdcard/ui2.xml ui2.xml
            grep -o 'text="[^"]*"' ui2.xml | head -12
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke
          path: |
            logcat.txt
            screen.png
            ui*.xml

  # Only ship builds that survive launch. Phone link: .../releases/latest/download/ModernMozart.apk
  release:
    runs-on: ubuntu-latest
    needs: smoke
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ModernMozart-apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" ModernMozart.apk -R "${{ github.repository }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. Passed emulator launch test. Open on your phone and tap Install." \
            --latest
